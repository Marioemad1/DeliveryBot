controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    Nema_controller:
      type: position_controllers/JointGroupPositionController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["base_middle_right_wheel_joint"]
    right_wheel_names: ["base_middle_left_wheel_joint"]

    use_stamped_vel: true

    wheel_separation: 0.7564899999999999999999999999999999999999999999999999999999
    wheel_radius: 0.139095

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    cmd_vel_timeout: 1.0
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    enable_odom_tf: true
    publish_rate: 50.0 
    position_feedback: true
    open_loop: false

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0



Nema_controller:
  ros__parameters:
    joints: [body_hatch_joint]
    interface_name: position