controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

# Ensure this block is at the root level (no indentation)
mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name:  "base_front_left_wheel_joint"
    front_right_wheel_command_joint_name: "base_front_right_wheel_joint"
    rear_left_wheel_command_joint_name:   "base_rear_left_wheel_joint"
    rear_right_wheel_command_joint_name:  "base_rear_right_wheel_joint"

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    enable_odom_tf: true
    tf_frame_prefix_enable: false
    tf_frame_prefix: ""


    reference_timeout: 0.5

    kinematics:
      wheels_radius: 0.12465
      # Replaced the space with an underscore below
      sum_of_robot_center_projection_on_X_Y_axis: 0.612894
      base_frame_offset: {x: 0.0, y: 0.0, theta: 0.0 }

    linear:
      x:
        max_velocity: 1.0
        max_acceleration: 1.0
      y:
        max_velocity: 2.0
        max_acceleration: 2.0

    angular:
      z:
        max_velocity: 2.0
        max_acceleration: 2.0