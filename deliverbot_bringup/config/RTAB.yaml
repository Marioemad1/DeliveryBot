rtabmap:
  ros__parameters:
    frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan: false
    subscribe_scan_cloud: true
    scan_cloud_topic: "/scan/points"
    imu_topic: "/imu"
    wait_imu_to_init: true
    approx_sync: true
    queue_size: 30
    sync_queue_size: 30
    topic_queue_size: 30
    qos: 2
    use_sim_time: true

    # Mapping parameters
    Rtabmap/DetectionRate: 1.0
    Mem/IncrementalMemory: true
    Grid/Sensor: 0
    Grid/RangeMax: 20.0
    Grid/CellSize: 0.05

icp_odometry:
  ros__parameters:
    frame_id: "base_link"
    odom_frame_id: "odom"
    scan_cloud_topic: "/scan/points"
    imu_topic: "/imu"
    wait_imu_to_init: true
    approx_sync: true
    queue_size: 30
    qos: 2
    use_sim_time: true
    scan_voxel_size: 0.05
    scan_normal_k: 10